epg:
  cache-dir: /var/lib/mirakc/epg

server:
  # Replace `localhost` with `0.0.0.0` (ipv4) or `::` (ipv6) if you like to
  # connect from other hosts.
  addrs:
    - http: '0.0.0.0:40772'

# Change the following channel settings according to your environment.
channels:
  - name: NHK
    type: GR
    channel: '27'
  - name: NHK-BS
    type: BS
    channel: BS15_0
  # NHK BS4K.  StreamID is passthrough, not a serviceId.
  # '45328' == '0xB110' as an opaque string.
  - name: NHK-BS4K
    type: BS4K
    channel: '45328'
    services: [101]
  # BS8K NHK.  Disabled by default.
  - name: BS8K-NHK
    type: BS4K
    channel: '45280'
    services: [102]
    disabled: true

  # BS4K EPG jobs use the bundled `mirakc-arib-tlv` by default (no setup
  # needed); override `jobs.update-schedules.command-bs4k` to change options.

tuners:
  # Use a Mirakurun-compatible server as a tuner.
  - name: mirakc
    types: [GR, BS]
    command: >-
      curl 'http://mirakc:40772/api/channels/{{{channel_type}}}/{{{channel}}}/stream?decode=0' -sG
  # Decoded-TLV remote server for BS4K.  Passthrough, no decode-filter needed.
  - name: bs4k
    types: [BS4K]
    command: >-
      curl 'http://192.168.1.133:40772/api/channels/{{{channel_type}}}/{{{channel}}}/stream?decode=0' -sG
  # Normally, you need to define a tuner for each device like below:
  #
  # - name: bs1
  #   types: [BS]
  #   command: >-
  #     recpt1 --device /dev/px4video0 {{{channel}}} - -
  # - name: gr1
  #   types: [BS]
  #   command: >-
  #     recpt1 --device /dev/px4video2 {{{channel}}} - -

filters:
  # Optionally, you can specify a command to process TS packets before sending
  # them to a client.
  #
  # The following command processes TS packets on a remote server listening on
  # TCP port 40773.
  decode-filter:
    command: >-
      socat -,cool-write tcp-connect:b25:40773
