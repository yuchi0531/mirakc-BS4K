[epg]
cache-dir = "/tmp"

[[server.addrs]]
http = "0.0.0.0:40772"

[[server.addrs]]
unix = "/var/run/mirakc.sock"

[server.mounts."/videos"]
path = "/tmp"
listing = true

[[channels]]
name = "NHK"
type = "GR"
channel = "27"

[[channels]]
name = "NHK-BS"
type = "BS"
channel = "BS15_0"
services = [ 101 ]

# NHK BS4K.  StreamID is passthrough, not a serviceId.
# "45328" == "0xB110" as an opaque string.
[[channels]]
name = "NHK-BS4K"
type = "BS4K"
channel = "45328"
services = [ 101 ]

# BS8K NHK.  Disabled by default, removed by normalize.
[[channels]]
name = "BS8K-NHK"
type = "BS4K"
channel = "45280"
services = [ 102 ]
disabled = true

[[tuners]]
name = "tuner"
types = [ "GR", "BS", "BS4K" ]
command = "cat /dev/null"

[[tuners]]
name = "tracker"
types = [ "GR", "BS" ]
command = "cat /dev/null"

[filters.decode-filter]
command = "cat /dev/null"

[recording]
basedir = "/tmp"

[onair-program-trackers.tracker.local]
channel-types = [ "GR", "BS" ]
uses = { tuner = "tracker" }

[resource]
strings-yaml = "/bin/true"

[[resource.logos]]
service-id = 3273601024
image = "/bin/true"
